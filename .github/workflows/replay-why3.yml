on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: 'rocq/rocq-prover:9.2'
          custom_script: |
            {{before_install}}
            
            startGroup "Install APT dependencies"
              sudo apt-get update -y -q
              DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -q --no-install-recommends zlib1g-dev
            endGroup

            startGroup "Pin Local Packages"
              opam pin add -n -y -k path coq-bertrand .
              opam pin add -n -y -k path coq-knuth-prime-whyml .
            endGroup

            startGroup "Install Dependencies"
              opam update -y
              opam install -y -j $(nproc) coq-knuth-prime-whyml --deps-only
            endGroup

            startGroup "Replay Why3 Proofs"
              opam install -y -v -j $(nproc) coq-knuth-prime-whyml
              opam list
            endGroup

            startGroup "Uninstallation test"
              opam remove -y coq-knuth-prime-whyml
              opam remove -y coq-bertrand
            endGroup
